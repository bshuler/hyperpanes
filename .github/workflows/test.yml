name: Test (Rust native)

# Push/PR test gate for the native Rust app: runs the test suite + clippy + rustfmt
# on every push and pull request — the check mature terminals (Alacritty, WezTerm)
# run before merge. Complements release-rust.yml, which now `needs:` this job to pass
# before it will build/publish an installer.
#
# `rs/` is split into independent Cargo workspaces: every crate that pulls the heavy
# Slint/wgpu fork is its own workspace root. We gate the two that own tests:
#   * `rs`                        — the lean headless core (~370 unit + integration tests),
#   * `rs/crates/terminal-widget` — the live-terminal widget (owns the seeded grid/keymap
#                                   reference tests under tests/).
# The GUI `rs/crates/app` workspace owns no tests, so it is not a leg here. It is
# build-verified on ubuntu + macOS + Windows by verify.yml's `build-gui` matrix (see
# docs/tool-panes-plan.md D12) and built for release by release-rust.yml at tag time —
# its heavy GPU build stays off THIS gate to keep the test path fast.
#
# `cargo test` is the HARD gate (it must pass; release-rust.yml is gated on it). `clippy`
# and `rustfmt` run report-only (`continue-on-error`) for now: the existing tree predates
# any lint pass and is not yet fmt-/clippy-clean, and a tree-wide reformat can't land here
# (it is out of this change's file scope and would collide with concurrent work on
# grid.rs/keys.rs). They surface drift as annotations today; flip `continue-on-error` to
# `false` once a one-time `cargo fmt` + clippy cleanup has landed to make them blocking.

on:
  push:
  pull_request:
  # On-demand run. The Windows leg is the only oracle for the ConPTY/pty-host tests
  # (they cannot execute on a developer's Mac or Linux box), so it must be possible to
  # ask for a run without inventing a commit.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.workspace }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          # Linux leg (W0-SEAMS): core + terminal-widget only — the GUI app crate has no
          # tests to run, and its per-OS compile is verify.yml's `build-gui` matrix (D12).
          - ubuntu-latest
          # macOS leg (T7 ci-matrix): mirrors the ubuntu leg exactly — same two
          # workspaces, no extra system deps needed (the apt step below is Linux-only).
          - macos-latest
        workspace:
          - rs
          - rs/crates/terminal-widget
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Slint/femtovg + the widget's font/window stack need the system dev packages on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config cmake clang \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}

      - name: Test
        run: cd ${{ matrix.workspace }} && cargo test --all

      # Report-only until the tree is cleaned (see header note); flip to `false` to block.
      - name: Clippy (deny warnings)
        continue-on-error: true
        run: cd ${{ matrix.workspace }} && cargo clippy --all-targets -- -D warnings

      - name: Rustfmt (check)
        continue-on-error: true
        run: cd ${{ matrix.workspace }} && cargo fmt -- --check

  # Mobile client (Flutter, mobile/hyperpanes_mobile): analyze is blocking (the tree is
  # lint-clean from day one, unlike the Rust side) and the unit suite gates the protocol
  # layer (pairing parse, /events frame decode, output-splice dedupe, path detection).
  mobile:
    name: mobile (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/hyperpanes_mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # The guardrails that keep an install from ending the live session daemon
  # (docs/live-session-safety.md). macOS-only: the installer's whole subject is
  # the app bundle directory and the BSD `uchg` flag. Blocking — the failure
  # mode they cover is the silent loss of every program running in every pane.
  guardrails:
    name: guardrails (install + hook)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Hook rules (allow/deny table)
        run: bash scripts/guard-live-sessions.test.sh

      - name: Safe installer (a live process must survive the swap)
        run: bash scripts/install-macos.test.sh
